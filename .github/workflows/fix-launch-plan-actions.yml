name: Fix Launch Plan edit delete controls

on:
  push:
    paths:
      - '.github/workflows/fix-launch-plan-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reveal milestone actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'tr.row:hover .rowacts{opacity:1}'
          new = 'tr.row:hover .rowacts{opacity:1}\n.mile .rowacts{opacity:.55;flex:none}\n.mile:hover .rowacts,.mile:focus-within .rowacts{opacity:1}\n@media(hover:none){.mile .rowacts{opacity:1}}'
          if old not in s:
              raise SystemExit('row action hover rule not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "FlockFam Command Center"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show edit and delete controls on Launch Plan milestones"
          git push
