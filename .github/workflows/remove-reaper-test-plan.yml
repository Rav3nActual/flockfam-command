name: Remove Reaper Test Plan card

on:
  push:
    paths:
      - '.github/workflows/remove-reaper-test-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Test Plan from Reaper card list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'const secs=["The Box","Test Plan (W10)"];'
          new = 'const secs=["The Box"];'
          if old not in s:
              raise SystemExit('Target render list not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "FlockFam Command Center"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Reaper Test Plan card"
          git push
