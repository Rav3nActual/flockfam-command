name: Apply Store Pulse

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/patch_store_pulse.py
      - .github/workflows/apply-store-pulse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch overview
        run: python scripts/patch_store_pulse.py
      - name: Commit changes
        run: |
          git config user.name "FlockFam Command Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Store Pulse metrics to overview"
            git push
          fi
