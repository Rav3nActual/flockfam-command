name: Adjust Store Pulse Row

on:
  push:
    paths:
      - '.github/workflows/adjust-store-pulse-row.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep Store Pulse cards on one row
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
              '.store-pulse .stat-grid{margin-bottom:0}',
              '.store-pulse .stat-grid{margin-bottom:0;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}'
          )
          s = s.replace(
              '.store-pulse .pulse-stat{background:var(--bg2);min-width:0}',
              '.store-pulse .pulse-stat{background:var(--bg2);min-width:0;padding:14px 12px}'
          )
          s = s.replace(
              '.store-pulse .pulse-stat .val{font-size:26px}',
              '.store-pulse .pulse-stat .val{font-size:22px}'
          )

          anchor = '.store-pulse .pulse-stat .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
          extra = anchor + '\n.store-pulse .pulse-stat .lbl{font-size:10.5px;white-space:nowrap}\n@media(max-width:900px){.store-pulse .panel-body{overflow-x:auto}.store-pulse .stat-grid{min-width:780px}}'
          if '.store-pulse .pulse-stat .lbl{font-size:10.5px' not in s:
              if anchor not in s:
                  raise SystemExit('Store Pulse CSS anchor not found')
              s = s.replace(anchor, extra, 1)

          p.write_text(s)
      - name: Commit layout update
        run: |
          git config user.name "FlockFam Command Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep Store Pulse cards in one row"
            git push
          fi
