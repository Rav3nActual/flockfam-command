name: Update Challenge 001 launch date

on:
  push:
    paths:
      - '.github/workflows/update-challenge-001-launch-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update launch date references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('const LAUNCH_DATE = "2026-09-28";', 'const LAUNCH_DATE = "2026-10-09";'),
              ('Challenge 001 · Sep 28', 'Challenge 001 · Oct 9'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "FlockFam Command Center"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Move Challenge 001 launch to October 9"
          git push
