name: Mobile Store Pulse Grid

on:
  push:
    paths:
      - '.github/workflows/mobile-store-pulse-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Store Pulse 3-across on mobile
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '@media(max-width:900px){.store-pulse .panel-body{overflow-x:auto}.store-pulse .stat-grid{min-width:780px}}'
          new = '@media(max-width:900px){.store-pulse .panel-body{overflow-x:visible;padding:14px}.store-pulse .stat-grid{grid-template-columns:repeat(3,minmax(0,1fr));min-width:0;gap:8px}.store-pulse .pulse-stat{padding:12px 9px}.store-pulse .pulse-stat .val{font-size:20px}.store-pulse .pulse-stat .lbl{font-size:9.5px;white-space:normal;line-height:1.15}.store-pulse .pulse-stat .sub{font-size:10px}}'
          if old not in s:
              raise SystemExit('Expected mobile Store Pulse CSS not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit change
        run: |
          git config user.name "FlockFam Command Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Stack Store Pulse cards 3 across on mobile"
          git push
