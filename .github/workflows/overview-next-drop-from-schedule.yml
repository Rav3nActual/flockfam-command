name: Fix Overview Next Drop source

on:
  push:
    paths:
      - '.github/workflows/overview-next-drop-from-schedule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Overview Next Drop use drop_schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_logic = '  const allDrops=[...DATA.drops.map(d=>({name:d.name,date:d.drop_date})),...DATA.products.filter(p=>p.drop_date).map(p=>({name:p.item,date:p.drop_date}))]\n      .filter(d=>d.date).sort((a,b)=>a.date<b.date?-1:1);\n  const nextDrop=allDrops.find(d=>!isOverdue(d.date))||allDrops[allDrops.length-1];'
          new_logic = '\n'.join([
              '  const now=today();',
              '  const cy=now.getFullYear(), cm=now.getMonth()+1, cw=Math.floor((now.getDate()-1)/7)+1;',
              '  const scheduledDrops=DATA.drop_schedule',
              '      .filter(d=>d.item&&d.year&&d.month)',
              '      .map(d=>({...d,weekNum:d.week||1}))',
              '      .filter(d=>d.year>cy||(d.year===cy&&(d.month>cm||(d.month===cm&&d.weekNum>=cw))))',
              '      .sort((a,b)=>(a.year-b.year)||(a.month-b.month)||(a.weekNum-b.weekNum)||((a.sort_order||0)-(b.sort_order||0)));',
              '  const nextDrop=scheduledDrops[0]||null;',
              '  const nextDropWhen=nextDrop?`${new Date(nextDrop.year,nextDrop.month-1,1).toLocaleString(undefined,{month:"long"})}${nextDrop.week?` · Week ${nextDrop.week}`:""}`:"no drops scheduled";'
          ])
          old_card = '    <div class="stat"><div class="lbl">Next Drop</div><div class="val" style="font-size:20px;line-height:1.2;margin-top:10px">${nextDrop?esc(nextDrop.name):\'—\'}</div><div class="sub">${nextDrop?fmtDate(nextDrop.date):\'no drops scheduled\'}</div></div>'
          new_card = '    <div class="stat"><div class="lbl">Next Drop</div><div class="val" style="font-size:20px;line-height:1.2;margin-top:10px">${nextDrop?esc(nextDrop.item):\'—\'}</div><div class="sub">${nextDropWhen}</div></div>'
          if old_logic not in s:
              raise SystemExit('Old next-drop logic not found')
          if old_card not in s:
              raise SystemExit('Old next-drop card not found')
          s = s.replace(old_logic, new_logic, 1)
          s = s.replace(old_card, new_card, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "FlockFam Command Center"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use Drop Schedule for Overview Next Drop"
          git push
