<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlockFam Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f11; --bg2:#121417; --panel:#16191d; --panel2:#1b1f24;
  --border:#262b32; --border2:#31373f;
  --text:#e9ecef; --muted:#9aa2ab; --muted2:#6b727b;
  --accent:#E8622A; --accent-soft:rgba(232,98,42,.14);
  --green:#43c187; --green-soft:rgba(67,193,135,.14);
  --blue:#5aa9e6; --blue-soft:rgba(90,169,230,.14);
  --amber:#e6b45a; --red:#e5645a; --red-soft:rgba(229,100,90,.14);
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,rgba(232,98,42,.10),transparent),var(--bg);padding:24px}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow)}
.login-card img{height:34px;display:block;margin:0 auto 4px}
.login-sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none}
.field input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--text);border-color:var(--border2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* ---------- LAYOUT ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 20px}
.brand img{height:26px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;background:transparent;border:none;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%;font-size:14px}
.nav button .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{border-top:1px solid var(--border);padding-top:14px;font-size:12px;color:var(--muted2)}
.side-foot .em{color:var(--muted);display:block;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{padding:26px 30px 60px;max-width:1180px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- CARDS / STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.02em;line-height:1}
.stat .sub{font-size:12.5px;color:var(--muted2);margin-top:6px}
.stat .val.accent{color:var(--accent)} .stat .val.green{color:var(--green)} .stat .val.amber{color:var(--amber)} .stat .val.red{color:var(--red)}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}
.panel-head h2{margin:0;font-size:15px;font-weight:700}
.panel-head .count{color:var(--muted2);font-weight:500;font-size:13px;margin-left:6px}
.panel-body{padding:6px 0}
.panel.pad .panel-body{padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ---------- TABLES ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);font-weight:600;padding:9px 18px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 18px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row:hover{background:var(--panel2)}
.tbl td.title-cell{font-weight:600}
.muted{color:var(--muted)} .muted2{color:var(--muted2)}
.overdue{color:var(--red)!important}
.right{text-align:right}
.rowacts{display:flex;gap:6px;justify-content:flex-end;opacity:0;transition:opacity .12s}
tr.row:hover .rowacts{opacity:1}
.iconbtn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:4px 8px;font-size:12px}
.iconbtn:hover{color:var(--text);border-color:var(--border2)}
.iconbtn.danger:hover{color:var(--red);border-color:var(--red)}

/* status pills / selects */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-notstarted{background:var(--panel2);color:var(--muted)}
.st-inprogress{background:var(--blue-soft);color:var(--blue)}
.st-complete{background:var(--green-soft);color:var(--green)}
.st-pitched,.st-waiting{background:var(--amber);color:#241a06}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);margin-right:5px}
.statussel{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font-size:12.5px}
.statussel:focus{outline:none;border-color:var(--accent)}
.chk{width:19px;height:19px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:12px;font-weight:800}
.chk.on{background:var(--green);border-color:var(--green);color:#06241a}

/* progress */
.prog{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.phase{padding:14px 18px;border-bottom:1px solid var(--border)}
.phase:last-child{border-bottom:none}
.phase-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.phase-top .nm{font-weight:700;font-size:13.5px}
.phase-top .pc{font-size:12px;color:var(--muted)}
.mile{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.mile:last-child{border-bottom:none}
.mile .t{flex:1}
.mile.done .t{color:var(--muted2);text-decoration:line-through}
.mile .due{font-size:12px;color:var(--muted2);white-space:nowrap}
.mile .due.od{color:var(--red)}

.empty{padding:34px 18px;text-align:center;color:var(--muted2);font-size:13.5px}
.banner{margin:0 18px 14px;padding:11px 14px;background:var(--blue-soft);border:1px solid rgba(90,169,230,.3);border-radius:10px;color:#bfe0f7;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}

/* ---------- DROP SCHEDULE GRID ---------- */
.gridwrap{overflow-x:auto;padding:0}
table.grid{border-collapse:collapse;width:100%;min-width:920px;font-size:12.5px}
table.grid th,table.grid td{border:1px solid var(--border);padding:0}
table.grid thead th{background:var(--bg2);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px;padding:7px 8px;text-align:center}
table.grid th.wk{font-size:10px;color:var(--muted2);font-weight:600}
table.grid td.mcol,table.grid th.mcol{background:var(--bg2);font-weight:600;color:var(--text);padding:8px 12px;white-space:nowrap;text-align:left;position:sticky;left:0;z-index:1;min-width:96px}
table.grid th.spcol{background:var(--accent-soft);color:var(--accent)}
table.grid td.gcell{min-width:80px;vertical-align:middle}
table.grid td.grpend{border-right:2px solid var(--border2)}
table.grid .ce{display:block;min-height:30px;padding:7px 8px;color:var(--text);outline:none;cursor:text;line-height:1.35}
table.grid .ce:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
table.grid .ce:empty::before{content:"+";color:var(--muted2);opacity:.3}
table.grid tbody tr:hover td.mcol{color:var(--accent)}
table.grid td.spcell .ce{color:var(--accent)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}
.modal-card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--border)}
.field textarea{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;resize:vertical;min-height:64px}
.field select{width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none}
.field select:focus,.field textarea:focus{border-color:var(--accent)}
.checkrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.checkrow label{margin:0;font-size:13.5px;color:var(--text)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:60;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.loading{padding:60px;text-align:center;color:var(--muted2)}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:232px}
  .sidebar.open{transform:none}
  .main{padding:18px 16px 60px}
  .mobtop{display:flex!important}
}
.mobtop{display:none;align-items:center;gap:12px;margin-bottom:14px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bwnwvbdzeqgxdmsrkand.supabase.co";
const SUPABASE_KEY = "sb_publishable_XG4tDiLVLs3mwhKrj_kFRg_nmDrFSjk";
const LAUNCH_DATE = "2026-09-28";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let DATA = {tasks:[],launch_milestones:[],products:[],drops:[],influencers:[],significant_dates:[],documents:[],drop_schedule:[],ideas:[],reaper_stages:[],reaper_items:[]};
let VIEW = "overview";

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=>new Date(new Date().toDateString());
function fmtDate(d){if(!d)return "";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function fmtShort(d){if(!d)return "";const dt=new Date(d+"T00:00:00");return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function isOverdue(d){return d && new Date(d+"T00:00:00") < today();}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function statusPill(s){const k=(s||"Not Started").toLowerCase().replace(/[^a-z]/g,"");return `<span class="pill st-${k}">${esc(s||"Not Started")}</span>`;}

/* ---------- auth ---------- */
async function initAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ enterApp(session); } else { $("#login").classList.remove("hidden"); }
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){location.reload();} });
}
async function doLogin(){
  const email=$("#email").value.trim(), password=$("#password").value;
  const btn=$("#loginBtn"), err=$("#loginErr");
  err.textContent=""; btn.disabled=true; btn.textContent="Signing in…";
  const done=(m)=>{ err.textContent=m; btn.disabled=false; btn.textContent="Sign in"; };
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ done((error.message||"Sign-in error")+(error.status?` (${error.status})`:"")); return; }
    if(!data||!data.session){ done("No session returned — double-check email and password."); return; }
    enterApp(data.session);
  }catch(e){ done("Login failed: "+((e&&e.message)?e.message:String(e))); }
}
function enterApp(session){
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#userEmail").textContent = session.user.email;
  loadAll();
}
$("#loginBtn").onclick=doLogin;
$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
$("#signOut").onclick=async()=>{await sb.auth.signOut();};

/* ---------- data ---------- */
async function loadAll(){
  const tables=Object.keys(DATA);
  const res=await Promise.all(tables.map(t=>sb.from(t).select("*").then(r=>r).catch(e=>({error:e,data:[]}))));
  const errs=[];
  tables.forEach((t,i)=>{ if(res[i].error){errs.push(t+": "+(res[i].error.message||res[i].error));} DATA[t]=res[i].data||[]; });
  if(errs.length) console.warn("FF load issues:",errs);
  // client sort
  DATA.tasks.sort((a,b)=>(a.sort_order-b.sort_order));
  DATA.products.sort((a,b)=>(a.sort_order-b.sort_order));
  DATA.launch_milestones.sort((a,b)=>(a.sort_order-b.sort_order));
  render();
}
async function saveRow(table,row){
  if(row.id){ const {id,...rest}=row; const {error}=await sb.from(table).update(rest).eq("id",id); if(error){toast("Save failed: "+error.message);return false;} }
  else { const {error}=await sb.from(table).insert(row); if(error){toast("Add failed: "+error.message);return false;} }
  await loadAll(); toast("Saved"); return true;
}
async function patchRow(table,id,patch){
  const {error}=await sb.from(table).update(patch).eq("id",id);
  if(error){toast("Update failed");return;}
  const r=DATA[table].find(x=>x.id===id); if(r)Object.assign(r,patch); render();
}
async function delRow(table,id){
  if(!confirm("Delete this item?"))return;
  const {error}=await sb.from(table).delete().eq("id",id);
  if(error){toast("Delete failed");return;}
  DATA[table]=DATA[table].filter(x=>x.id!==id); render(); toast("Deleted");
}

/* ---------- nav ---------- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  VIEW=b.dataset.view;[...$("#nav").children].forEach(x=>x.classList.toggle("active",x===b));
  $("#sidebar").classList.remove("open");render();});
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");

/* ---------- render ---------- */
function render(){
  const c=$("#content");
  if(VIEW==="overview")c.innerHTML=viewOverview();
  else if(VIEW==="todo")c.innerHTML=viewTodo();
  else if(VIEW==="launch")c.innerHTML=viewLaunch();
  else if(VIEW==="reaper")c.innerHTML=viewReaper();
  else if(VIEW==="drops")c.innerHTML=viewDrops();
  else if(VIEW==="growth")c.innerHTML=viewGrowth();
  else if(VIEW==="ideas")c.innerHTML=viewIdeas();
  else if(VIEW==="docs")c.innerHTML=viewDocs();
  bindActions();
}

/* ===== OVERVIEW ===== */
function nextOccurrence(d){ // annual dates -> next month/day occurrence
  if(!d)return null; const dt=new Date(d+"T00:00:00"); const now=today();
  let occ=new Date(now.getFullYear(),dt.getMonth(),dt.getDate());
  if(occ<now)occ=new Date(now.getFullYear()+1,dt.getMonth(),dt.getDate());
  return occ;
}
function viewOverview(){
  const openTasks=DATA.tasks.filter(t=>t.status!=="Complete");
  const overdue=openTasks.filter(t=>isOverdue(t.due_date));
  const miles=DATA.launch_milestones, mdone=miles.filter(m=>m.status==="Complete").length;
  const mpct=miles.length?Math.round(mdone/miles.length*100):0;
  const dToLaunch=daysBetween(today(),new Date(LAUNCH_DATE+"T00:00:00"));
  const allDrops=[...DATA.drops.map(d=>({name:d.name,date:d.drop_date})),...DATA.products.filter(p=>p.drop_date).map(p=>({name:p.item,date:p.drop_date}))]
      .filter(d=>d.date).sort((a,b)=>a.date<b.date?-1:1);
  const nextDrop=allDrops.find(d=>!isOverdue(d.date))||allDrops[allDrops.length-1];
  const upDates=DATA.significant_dates.map(d=>({...d,occ:nextOccurrence(d.event_date)})).filter(d=>d.occ)
      .sort((a,b)=>a.occ-b.occ).slice(0,5);

  let h=`<div class="page-head"><div><h1>Overview</h1><p>Everything FlockFam, at a glance — ${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p></div></div>`;
  h+=`<div class="stat-grid">
    <div class="stat"><div class="lbl">Open Tasks</div><div class="val ${overdue.length?'amber':''}">${openTasks.length}</div><div class="sub">${overdue.length} overdue</div></div>
    <div class="stat"><div class="lbl">Days to Launch</div><div class="val accent">${dToLaunch>0?dToLaunch:0}</div><div class="sub">Challenge 001 · Sep 28</div></div>
    <div class="stat"><div class="lbl">Launch Plan</div><div class="val green">${mpct}%</div><div class="sub">${mdone}/${miles.length} milestones</div></div>
    <div class="stat"><div class="lbl">Next Drop</div><div class="val" style="font-size:20px;line-height:1.2;margin-top:10px">${nextDrop?esc(nextDrop.name):'—'}</div><div class="sub">${nextDrop?fmtDate(nextDrop.date):'no drops scheduled'}</div></div>
  </div>`;

  h+=`<div class="grid2">`;
  // overdue / open tasks
  h+=`<div class="panel"><div class="panel-head"><h2>Needs Attention <span class="count">${overdue.length} overdue</span></h2><button class="btn sm" data-add="tasks">+ Task</button></div><div class="panel-body">`;
  const attn=[...overdue,...openTasks.filter(t=>!isOverdue(t.due_date))].slice(0,6);
  if(attn.length){h+=`<table class="tbl"><tbody>`;

/* ===== DROP SCHEDULE GRID ===== */
const GRID_YEAR=2026;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dropGrid(){
  const cats=["Patches","Apparel","Misc"];
  const rows=DATA.drop_schedule.filter(r=>r.year===GRID_YEAR);
  const lookup={}; rows.forEach(r=>{ lookup[`${r.month}|${r.category}|${r.week||0}`]=r; });
  const cell=(m,cat,w,extra)=>{ const r=lookup[`${m}|${cat}|${w||0}`]; const val=r?esc(r.item):"";
    return `<td class="gcell ${extra||''}"><span class="ce" contenteditable="true" data-cellkey="${m}|${cat}|${w||0}">${val}</span></td>`; };
  let h=`<div class="panel"><div class="panel-head"><h2>Drop Schedule <span class="count">${GRID_YEAR}</span></h2><span class="muted2" style="font-size:12px">Click any cell to edit — saves live</span></div>`;
  h+=`<div class="gridwrap"><table class="grid"><thead>`;
  h+=`<tr><th class="mcol" rowspan="2">Month</th><th colspan="4">Patches</th><th colspan="4">Apparel</th><th colspan="4">Misc</th><th class="spcol" rowspan="2">Special Projects</th></tr>`;
  h+=`<tr>`+cats.map(()=>[1,2,3,4].map(w=>`<th class="wk">W${w}</th>`).join("")).join("")+`</tr></thead><tbody>`;
  MONTHS.forEach((mn,i)=>{ const m=i+1;
    h+=`<tr><td class="mcol">${mn}</td>`;
    cats.forEach(cat=>{ for(let w=1;w<=4;w++) h+=cell(m,cat,w, w===4?'grpend':''); });
    h+=cell(m,"Special",null,"spcell");
    h+=`</tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}
async function setCell(month,category,week,value){
  value=(value||"").trim();
  const existing=DATA.drop_schedule.find(r=>r.year===GRID_YEAR&&r.month===month&&r.category===category&&(r.week||0)===(week||0));
  if(existing){
    if(value===existing.item) return;
    if(!value){ const {error}=await sb.from("drop_schedule").delete().eq("id",existing.id); if(error){toast("Delete failed");return;} DATA.drop_schedule=DATA.drop_schedule.filter(r=>r.id!==existing.id); toast("Cleared"); }
    else { const {error}=await sb.from("drop_schedule").update({item:value}).eq("id",existing.id); if(error){toast("Save failed");return;} existing.item=value; toast("Saved"); }
  } else if(value){
    const {error}=await sb.from("drop_schedule").insert({year:GRID_YEAR,month,category,week:week||null,item:value}); if(error){toast("Add failed");return;} await loadAll(); toast("Saved");
  }
}

function statusSelect(table,id,cur,opts){

function cbCell(table,id,field,val){
  return `<td class="right"><span class="chk ${val?'on':''}" data-cb="${table}|${id}|${field}" data-val="${val?1:0}">${val?'✓':''}</span></td>`;
}
function editDel(table,id){return `<button class="iconbtn" data-edit="${table}|${id}">Edit</button><button class="iconbtn danger" data-del="${table}|${id}">✕</button>`;}

function bindActions(){
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const p={};if(b.dataset.cat)p.category=b.dataset.cat;if(b.dataset.sec)p.section=b.dataset.sec;openModal(b.dataset.add,null,Object.keys(p).length?p:null);});
  document.querySelectorAll("[data-ritem]").forEach(c=>c.onclick=()=>patchRow("reaper_items",c.dataset.ritem,{done:c.dataset.done!=="1"}));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const[t,id]=b.dataset.edit.split("|");openModal(t,DATA[t].find(x=>x.id===id));});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[t,id]=b.dataset.del.split("|");delRow(t,id);});
  document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>{const[t,id]=s.dataset.status.split("|");patchRow(t,id,{status:s.value||null});});
  document.querySelectorAll("[data-cb]").forEach(c=>c.onclick=()=>{const[t,id,f]=c.dataset.cb.split("|");patchRow(t,id,{[f]:c.dataset.val!=="1"});});
  document.querySelectorAll("[data-toggle-mile]").forEach(c=>c.onclick=()=>{const id=c.dataset.toggleMile;const done=c.dataset.cur==="Complete";patchRow("launch_milestones",id,{status:done?"Not Started":"Complete"});});
  document.querySelectorAll(".grid .ce").forEach(c=>{
    c.addEventListener("blur",()=>{const[m,cat,w]=c.dataset.cellkey.split("|");setCell(+m,cat,w==="0"?null:+w,c.textContent);});
    c.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();c.blur();}});
  });
}

function openModal(table,row,preset){
  const cfg=FORMS[table];const editing=!!(row&&row.id);row=row||preset||{};
  let body="";
  cfg.fields.forEach(f=>{
    let v=row[f.k];
    if(f.t==="check"){body+=`<div class="checkrow"><span class="chk ${v?'on':''}" data-mcheck="${f.k}" data-val="${v?1:0}">${v?'✓':''}</span><label>${f.l}</label></div>`;return;}
    if(Array.isArray(v))v=v.join(", ");
    body+=`<div class="field"><label>${f.l}${f.req?' *':''}</label>`;
    if(f.t==="textarea")body+=`<textarea data-f="${f.k}">${esc(v||"")}</textarea>`;
    else if(f.t==="select")body+=`<select data-f="${f.k}">`+f.opts.map(o=>`<option ${o===(v||"")?'selected':''} value="${esc(o)}">${o||'—'}</option>`).join('')+`</select>`;
    else body+=`<input data-f="${f.k}" type="${f.t}" value="${esc(v||"")}">`;
    body+=`</div>`;
  });
  const m=el("div");m.id="modal";
  m.innerHTML=`<div class="modal-card"><div class="modal-head"><h3>${editing?'Edit':'New'} ${cfg.title}</h3><button class="iconbtn" id="mClose">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn" id="mSave">${editing?'Save':'Add'}</button></div></div>`;
  $("#modalMount").innerHTML="";$("#modalMount").appendChild(m);
  m.querySelectorAll("[data-mcheck]").forEach(c=>c.onclick=()=>{const on=c.dataset.val!=="1";c.dataset.val=on?1:0;c.classList.toggle("on",on);c.textContent=on?'✓':'';});
  const close=()=>$("#modalMount").innerHTML="";
  m.onclick=e=>{if(e.target===m)close();};
  $("#mClose").onclick=close;$("#mCancel").onclick=close;
  $("#mSave").onclick=async()=>{
    const out=row.id?{id:row.id}:{};
    for(const f of cfg.fields){
      if(f.t==="check"){out[f.k]=m.querySelector(`[data-mcheck="${f.k}"]`).dataset.val==="1";continue;}
      const inp=m.querySelector(`[data-f="${f.k}"]`);let val=inp.value.trim();
      if(f.req&&!val){inp.focus();inp.style.borderColor="var(--red)";return;}
      if(f.k==="platform"||f.k==="tags"){out[f.k]=val?val.split(",").map(s=>s.trim()).filter(Boolean):[];continue;}
      out[f.k]=val||null;
    }
    if(await saveRow(table,out))close();
  };
}

initAuth();
</script>
</body>
</html>
